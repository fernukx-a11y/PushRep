<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>PushRep</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #startScreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        p {
            color: #aaa;
        }

        #cameraButton {
            margin-top: 25px;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #cameraBox {
            position: fixed;
            inset: 0;
            display: none;
            background: black;
        }

        #camera {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 15px;
            border-radius: 10px;
            background: rgba(0,0,0,0.65);
            color: white;
            z-index: 5;
        }
    </style>
</head>

<body>

<div id="startScreen">

    <h1>💪 PushRep</h1>

    <p>AI-счётчик отжиманий</p>

    <button id="cameraButton">
        📷 Включить камеру
    </button>

</div>


<div id="cameraBox">

    <video id="camera" autoplay playsinline></video>

    <canvas id="canvas"></canvas>

    <div id="status">
        Запуск камеры...
    </div>

</div>


<script>

const button = document.getElementById("cameraButton");

const startScreen = document.getElementById("startScreen");

const cameraBox = document.getElementById("cameraBox");

const video = document.getElementById("camera");

const status = document.getElementById("status");

const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");


button.addEventListener("click", async function () {

    try {

        status.textContent = "Запрашиваем камеру...";

        startScreen.style.display = "none";

        cameraBox.style.display = "block";


        const stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user",
                width: {
                    ideal: 1920
                },
                height: {
                    ideal: 1080
                }
            },

            audio: false

        });


        video.srcObject = stream;

        await video.play();


        status.textContent = "Камера работает ✅";


        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;


        /*
         * Теперь после запуска камеры
         * загружаем AI.
         */

        loadAI();


    } catch (error) {

        console.error(error);

        startScreen.style.display = "flex";

        cameraBox.style.display = "none";

        alert(
            "Ошибка камеры:\n" +
            error.message
        );

    }

});


async function loadAI() {

    try {

        status.textContent = "Загружаем AI...";


        const module =
            await import(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm"
            );


        const PoseLandmarker =
            module.PoseLandmarker;

        const FilesetResolver =
            module.FilesetResolver;

        const DrawingUtils =
            module.DrawingUtils;


        const vision =
            await FilesetResolver.forVisionTasks(

                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"

            );


        const poseLandmarker =
            await PoseLandmarker.createFromOptions(

                vision,

                {

                    baseOptions: {

                        modelAssetPath:
                            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"

                    },

                    runningMode: "VIDEO",

                    numPoses: 1

                }

            );


        status.textContent = "AI готов 🤖";


        function detectPose() {

            if (video.readyState >= 2) {

                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;


                const results =
                    poseLandmarker.detectForVideo(

                        video,

                        performance.now()

                    );


                ctx.clearRect(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                if (results.landmarks.length > 0) {

                    const drawingUtils =
                        new DrawingUtils(ctx);


                    const landmarks =
                        results.landmarks[0];


                    drawingUtils.drawConnectors(

                        landmarks,

                        PoseLandmarker.POSE_CONNECTIONS,

                        {
                            lineWidth: 5
                        }

                    );


                    drawingUtils.drawLandmarks(

                        landmarks,

                        {
                            radius: 7,
                            lineWidth: 3
                        }

                    );


                    status.textContent =
                        "Человек обнаружен 🤖";

                } else {

                    status.textContent =
                        "Встань в кадр";

                }

            }


            requestAnimationFrame(detectPose);

        }


        detectPose();


    } catch (error) {

        console.error(error);

        status.textContent =
            "Камера работает, но AI не загрузился";

        alert(
            "Камера работает.\n\n" +
            "Ошибка AI:\n" +
            error.message
        );

    }

}

</script>

</body>
</html>
