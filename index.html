<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PushRep</title>

    <style>
        body {
            background: #111;
            color: white;
            text-align: center;
            font-family: Arial;
            padding: 20px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            border: 0;
            border-radius: 12px;
            margin: 20px;
        }

        video {
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
        }
    </style>
</head>

<body>

<h1>💪 PushRep</h1>

<button id="cameraButton">📷 Включить камеру</button>

<br>

<video id="camera" autoplay playsinline></video>

<p id="status">Камера выключена</p>

<script>

const button = document.getElementById("cameraButton");
const video = document.getElementById("camera");
const status = document.getElementById("status");

button.addEventListener("click", async () => {

    try {

        status.textContent = "Запрашиваем камеру...";

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        status.textContent = "Камера работает ✅";

    } catch (error) {

        console.error(error);

        status.textContent = "Ошибка: " + error.message;
    }

});

</script>

</body>
</html>
