<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>PushRep</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            margin: 15px 0 5px;
            font-size: 28px;
        }

        #status {
            margin: 5px 15px 10px;
            color: #aaa;
            font-size: 15px;
            min-height: 20px;
        }

        #cameraContainer {
            position: relative;
            width: 100%;
            height: calc(100vh - 180px);
            min-height: 350px;
            overflow: hidden;
            background: black;
        }

        #video,
        #canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: contain;
            left: 0;
            top: 0;
            transform: none;
        }

        #video {
            z-index: 1;
        }

        #canvas {
            z-index: 2;
            pointer-events: none;
        }

        #counter {
            position: absolute;
            z-index: 5;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 55px;
            font-weight: bold;
            text-shadow: 0 2px 8px black;
        }

        #cameraButton {
            margin-top: 15px;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: #00c853;
            color: white;
            font-size: 18px;
            font-weight: bold;
        }

        #cameraButton:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>

<h1>💪 PushRep</h1>

<div id="status">Нажми кнопку и начни тренировку</div>

<div id="cameraContainer">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <div id="counter">0</div>
</div>

<button id="cameraButton">📷 Начать тренировку</button>

<script>

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const button = document.getElementById("cameraButton");
const status = document.getElementById("status");
const counter = document.getElementById("counter");

let pose = null;
let cameraStream = null;
let aiReady = false;

let pushUps = 0;

let position = "up";
let canCount = true;

let lastCountTime = 0;


// ===============================
// КАМЕРА
// ===============================

async function startCamera() {

    try {

        status.textContent = "Запрашиваю камеру...";

        cameraStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 1920 },
                height: { ideal: 1080 }
            },
            audio: false
        });

        video.srcObject = cameraStream;

        await video.play();

        canvas.width = video.videoWidth || 1280;
        canvas.height = video.videoHeight || 720;

        status.textContent = "Камера работает. Загружаю AI...";

        await startAI();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Ошибка камеры: " + error.message;
    }
}


// ===============================
// AI
// ===============================

async function startAI() {

    try {

        pose = new Pose({
            locateFile: function(file) {

                return (
                    "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                    file
                );

            }
        });

        pose.setOptions({

            modelComplexity: 1,

            smoothLandmarks: true,

            enableSegmentation: false,

            smoothSegmentation: false,

            minDetectionConfidence: 0.5,

            minTrackingConfidence: 0.5

        });

        pose.onResults(onResults);

        aiReady = true;

        status.textContent =
            "AI готов. Встань боком и начинай отжиматься.";

        processFrame();

    } catch (error) {

        console.error(error);

        status.textContent =
            "Ошибка AI: " + error.message;
    }
}


// ===============================
// ОБРАБОТКА КАДРОВ
// ===============================

async function processFrame() {

    if (!aiReady) return;

    try {

        await pose.send({
            image: video
        });

    } catch (error) {

        console.error(error);

    }

    requestAnimationFrame(processFrame);
}


// ===============================
// РЕЗУЛЬТАТ AI
// ===============================

function onResults(results) {

    canvas.width = video.videoWidth || canvas.width;
    canvas.height = video.videoHeight || canvas.height;

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    if (!results.poseLandmarks) {

        status.textContent =
            "Человек не найден";

        return;
    }


    // ЛИНИИ СКЕЛЕТА

    drawConnectors(
        ctx,
        results.poseLandmarks,
        POSE_CONNECTIONS,
        {
            color: "#00FF00",
            lineWidth: 5
        }
    );


    // ТОЧКИ

    drawLandmarks(
        ctx,
        results.poseLandmarks,
        {
            color: "#FF0000",
            lineWidth: 2,
            radius: 6
        }
    );


    countPushUp(results.poseLandmarks);
}


// ===============================
// ПРОВЕРКА ВИДИМОСТИ
// ===============================

function visible(point) {

    return (
        point &&
        point.visibility !== undefined &&
        point.visibility >= 0.35
    );
}


// ===============================
// УГОЛ
// ===============================

function calculateAngle(a, b, c) {

    const radians =
        Math.atan2(
            c.y - b.y,
            c.x - b.x
        )
        -
        Math.atan2(
            a.y - b.y,
            a.x - b.x
        );

    let angle =
        Math.abs(
            radians * 180 / Math.PI
        );

    if (angle > 180) {

        angle = 360 - angle;

    }

    return angle;
}


// ===============================
// ПРОВЕРКА ЛОКТЕЙ
// ===============================

function elbowsAreReasonable(landmarks) {

    const leftShoulder = landmarks[11];
    const rightShoulder = landmarks[12];

    const leftElbow = landmarks[13];
    const rightElbow = landmarks[14];

    if (
        !visible(leftShoulder) ||
        !visible(rightShoulder) ||
        !visible(leftElbow) ||
        !visible(rightElbow)
    ) {

        return true;
    }


    const shoulderWidth =
        Math.abs(
            leftShoulder.x -
            rightShoulder.x
        );


    const leftDistance =
        Math.abs(
            leftElbow.x -
            leftShoulder.x
        );

    const rightDistance =
        Math.abs(
            rightElbow.x -
            rightShoulder.x
        );


    /*
        Не запрещаем обычное движение рук.
        Блокируем только явно сильно разведённые локти.
    */

    if (
        leftDistance > shoulderWidth * 2.8 ||
        rightDistance > shoulderWidth * 2.8
    ) {

        return false;
    }


    return true;
}


// ===============================
// ДОПОЛНИТЕЛЬНАЯ ПРОВЕРКА КОЛЕНЕЙ
// ===============================

function kneesLookSuspicious(landmarks) {

    const leftHip = landmarks[23];
    const rightHip = landmarks[24];

    const leftKnee = landmarks[25];
    const rightKnee = landmarks[26];

    /*
        ВАЖНО:

        Если ноги не видны —
        НЕ блокируем отжимание.

        Это исправляет проблему,
        когда камера не видит ноги полностью.
    */

    const leftVisible =
        visible(leftHip) &&
        visible(leftKnee);

    const rightVisible =
        visible(rightHip) &&
        visible(rightKnee);


    if (!leftVisible && !rightVisible) {

        return false;
    }


    /*
        Если колено очень близко к тазу
        по вертикали, это может быть
        положение с согнутыми ногами.
    */

    if (leftVisible) {

        const hipKneeDistance =
            Math.abs(
                leftHip.y -
                leftKnee.y
            );

        if (hipKneeDistance < 0.10) {

            return true;
        }
    }


    if (rightVisible) {

        const hipKneeDistance =
            Math.abs(
                rightHip.y -
                rightKnee.y
            );

        if (hipKneeDistance < 0.10) {

            return true;
        }
    }


    return false;
}


// ===============================
// СЧЁТ ОТЖИМАНИЙ
// ===============================

function countPushUp(landmarks) {

    const leftShoulder = landmarks[11];
    const leftElbow = landmarks[13];
    const leftWrist = landmarks[15];

    const rightShoulder = landmarks[12];
    const rightElbow = landmarks[14];
    const rightWrist = landmarks[16];


    /*
        Для счёта нужны только руки.

        Ноги теперь НЕ обязательны.
    */

    const leftReady =
        visible(leftShoulder) &&
        visible(leftElbow) &&
        visible(leftWrist);

    const rightReady =
        visible(rightShoulder) &&
        visible(rightElbow) &&
        visible(rightWrist);


    if (!leftReady && !rightReady) {

        status.textContent =
            "Покажи руки камере";

        return;
    }


    let angles = [];


    if (leftReady) {

        angles.push(
            calculateAngle(
                leftShoulder,
                leftElbow,
                leftWrist
            )
        );
    }


    if (rightReady) {

        angles.push(
            calculateAngle(
                rightShoulder,
                rightElbow,
                rightWrist
            )
        );
    }


    const averageAngle =
        angles.reduce(
            (a, b) => a + b,
            0
        ) / angles.length;


    // ===========================
    // ВНИЗ
    // ===========================

    if (
        averageAngle < 110 &&
        position === "up"
    ) {

        position = "down";

        status.textContent =
            "⬇️ Вниз";
    }


    // ===========================
    // ВВЕРХ
    // ===========================

    if (
        averageAngle > 150 &&
        position === "down" &&
        canCount
    ) {

        const now = Date.now();


        /*
            Защита от двойного счёта.
        */

        if (
            now - lastCountTime > 500
        ) {


            // Локти

            const elbowsOK =
                elbowsAreReasonable(
                    landmarks
                );


            // Колени

            const kneesBad =
                kneesLookSuspicious(
                    landmarks
                );


            /*
                Если AI видит колени
                и считает их подозрительными —
                не засчитываем.

                Если ног вообще не видно —
                отжимание всё равно считается.
            */

            if (
                elbowsOK &&
                !kneesBad
            ) {

                pushUps++;

                counter.textContent =
                    pushUps;

                status.textContent =
                    "🔥 Отлично!";

                lastCountTime = now;

            } else {

                status.textContent =
                    "⚠️ Исправь технику";
            }


            position = "up";

            canCount = false;


            setTimeout(
                () => {
                    canCount = true;
                },
                300
            );
        }
    }


    // ===========================
    // ПОДСКАЗКИ
    // ===========================

    if (
        position === "up" &&
        averageAngle > 150
    ) {

        status.textContent =
            "Готов. Опускайся ⬇️";
    }
}


// ===============================
// КНОПКА
// ===============================

button.addEventListener(
    "click",
    async function() {

        button.style.display = "none";

        await startCamera();

    }
);

</script>

</body>
</html>
