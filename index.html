<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PushRep</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        p {
            color: #aaa;
        }

        button {
            margin-top: 20px;
            padding: 15px 25px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        video {
            width: 100%;
            max-width: 500px;
            margin-top: 25px;
            border-radius: 15px;
            display: none;
        }
    </style>
</head>

<body>

    <h1>💪 PushRep</h1>

    <p>AI-счётчик отжиманий</p>

    <button onclick="startCamera()">
        📷 Включить камеру
    </button>

    <video id="camera" autoplay playsinline></video>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                const video = document.getElementById("camera");

                video.srcObject = stream;
                video.style.display = "block";

            } catch (error) {
                alert("Не удалось включить камеру: " + error.message);
            }
        }
    </script>

</body>
</html>
