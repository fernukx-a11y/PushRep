<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>PushRep</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #startScreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        #startScreen h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        #startScreen p {
            color: #aaa;
        }

        #cameraButton {
            margin-top: 25px;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #cameraBox {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #camera {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: none;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 16px;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font-size: 15px;
            z-index: 10;
            white-space: nowrap;
        }

        #counter {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 22px;
            border-radius: 15px;
            font-size: 28px;
            font-weight: bold;
            z-index: 10;
        }
    </style>
</head>

<body>

<div id="startScreen">

    <h1>💪 PushRep</h1>

    <p>AI-счётчик отжиманий</p>

    <button id="cameraButton">
        📷 Включить камеру
    </button>

</div>


<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <canvas id="canvas"></canvas>

    <div id="status">
        Запуск...
    </div>

    <div id="counter">
        Отжимания: 0
    </div>

</div>


<script>

const button =
    document.getElementById("cameraButton");

const startScreen =
    document.getElementById("startScreen");

const cameraBox =
    document.getElementById("cameraBox");

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const counter =
    document.getElementById("counter");


let pose = null;
let cameraStream = null;
let aiReady = false;


/* =========================
   СЧЁТЧИК
========================= */

let pushUps = 0;

let position = "up";

let canCount = true;


/* =========================
   КНОПКА
========================= */

button.addEventListener(
    "click",
    startCamera
);


/* =========================
   КАМЕРА
========================= */

async function startCamera() {

    try {

        startScreen.style.display = "none";

        cameraBox.style.display = "block";

        status.textContent =
            "Запрашиваем камеру...";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {
                    facingMode: "user",

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }
                },

                audio: false
            });


        video.srcObject =
            cameraStream;

        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        status.textContent =
            "Камера работает ✅";


        startAI();


    } catch (error) {

        console.error(error);

        cameraBox.style.display =
            "none";

        startScreen.style.display =
            "flex";

        alert(
            "Ошибка камеры:\n" +
            error.message
        );
    }
}


/* =========================
   AI
========================= */

function startAI() {

    status.textContent =
        "Загружаем AI...";


    if (
        typeof Pose === "undefined"
    ) {

        status.textContent =
            "AI ещё загружается...";

        setTimeout(
            startAI,
            1000
        );

        return;
    }


    pose = new Pose({

        locateFile: function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                file
            );
        }
    });


    pose.setOptions({

        modelComplexity: 1,

        smoothLandmarks: true,

        enableSegmentation: false,

        smoothSegmentation: false,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5
    });


    pose.onResults(
        onResults
    );


    aiReady = true;

    status.textContent =
        "AI готов 🤖";


    detectPose();
}


/* =========================
   РАСПОЗНАВАНИЕ
========================= */

async function detectPose() {

    if (
        !aiReady ||
        !video.videoWidth
    ) {

        requestAnimationFrame(
            detectPose
        );

        return;
    }


    try {

        await pose.send({
            image: video
        });

    } catch (error) {

        console.error(error);
    }


    requestAnimationFrame(
        detectPose
    );
}


/* =========================
   РЕЗУЛЬТАТ
========================= */

function onResults(results) {

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (
        results.poseLandmarks
    ) {

        drawConnectors(
            ctx,
            results.poseLandmarks,
            POSE_CONNECTIONS,
            {
                color: "#00FF00",
                lineWidth: 5
            }
        );


        drawLandmarks(
            ctx,
            results.poseLandmarks,
            {
                color: "#FF0000",
                lineWidth: 2,
                radius: 6
            }
        );


        countPushUp(
            results.poseLandmarks
        );


    } else {

        status.textContent =
            "Встань в кадр";
    }
}


/* =========================
   УГОЛ
========================= */

function calculateAngle(a, b, c) {

    const radians =
        Math.atan2(
            c.y - b.y,
            c.x - b.x
        ) -
        Math.atan2(
            a.y - b.y,
            a.x - b.x
        );


    let angle =
        Math.abs(
            radians * 180 / Math.PI
        );


    if (angle > 180) {
        angle = 360 - angle;
    }


    return angle;
}


/* =========================
   ВИДИМОСТЬ
========================= */

function visible(point) {

    return (
        point &&
        point.visibility >= 0.45
    );
}


/* =========================
   ПРОВЕРКА НОГ
========================= */

function legsAreExtended(landmarks) {

    const leftHip =
        landmarks[23];

    const leftKnee =
        landmarks[25];

    const leftAnkle =
        landmarks[27];

    const rightHip =
        landmarks[24];

    const rightKnee =
        landmarks[26];

    const rightAnkle =
        landmarks[28];


    if (
        !visible(leftHip) ||
        !visible(leftKnee) ||
        !visible(leftAnkle) ||

        !visible(rightHip) ||
        !visible(rightKnee) ||
        !visible(rightAnkle)
    ) {

        return false;
    }


    const leftKneeAngle =
        calculateAngle(
            leftHip,
            leftKnee,
            leftAnkle
        );


    const rightKneeAngle =
        calculateAngle(
            rightHip,
            rightKnee,
            rightAnkle
        );


    /*
     * Мягкий порог.
     *
     * Если человек стоит на коленях,
     * угол обычно значительно меньше.
     */

    return (
        leftKneeAngle > 135 &&
        rightKneeAngle > 135
    );
}


/* =========================
   ПРОВЕРКА КОРПУСА
========================= */

function bodyIsReasonablyStraight(landmarks) {

    const leftShoulder =
        landmarks[11];

    const leftHip =
        landmarks[23];

    const leftAnkle =
        landmarks[27];


    const rightShoulder =
        landmarks[12];

    const rightHip =
        landmarks[24];

    const rightAnkle =
        landmarks[28];


    if (
        !visible(leftShoulder) ||
        !visible(leftHip) ||
        !visible(leftAnkle) ||

        !visible(rightShoulder) ||
        !visible(rightHip) ||
        !visible(rightAnkle)
    ) {

        return false;
    }


    const leftAngle =
        calculateAngle(
            leftShoulder,
            leftHip,
            leftAnkle
        );


    const rightAngle =
        calculateAngle(
            rightShoulder,
            rightHip,
            rightAnkle
        );


    /*
     * Не требуем идеальной прямой.
     */

    return (
        leftAngle > 135 &&
        rightAngle > 135
    );
}


/* =========================
   ПРОВЕРКА ЛОКТЕЙ
========================= */

function elbowsAreAcceptable(landmarks) {

    const leftShoulder =
        landmarks[11];

    const leftElbow =
        landmarks[13];

    const leftWrist =
        landmarks[15];


    const rightShoulder =
        landmarks[12];

    const rightElbow =
        landmarks[14];

    const rightWrist =
        landmarks[16];


    if (
        !visible(leftShoulder) ||
        !visible(leftElbow) ||
        !visible(leftWrist) ||

        !visible(rightShoulder) ||
        !visible(rightElbow) ||
        !visible(rightWrist)
    ) {

        return false;
    }


    const leftAngle =
        calculateAngle(
            leftShoulder,
            leftElbow,
            leftWrist
        );


    const rightAngle =
        calculateAngle(
            rightShoulder,
            rightElbow,
            rightWrist
        );


    /*
     * Слишком экстремально
     * разведённые локти.
     */

    const shoulderWidth =
        Math.abs(
            leftShoulder.x -
            rightShoulder.x
        );


    const elbowWidth =
        Math.abs(
            leftElbow.x -
            rightElbow.x
        );


    const elbowsTooWide =
        elbowWidth >
        shoulderWidth * 2.5;


    return !elbowsTooWide;
}


/* =========================
   СЧЁТЧИК
========================= */

function countPushUp(landmarks) {

    const leftShoulder =
        landmarks[11];

    const leftElbow =
        landmarks[13];

    const leftWrist =
        landmarks[15];


    const rightShoulder =
        landmarks[12];

    const rightElbow =
        landmarks[14];

    const rightWrist =
        landmarks[16];


    if (
        !visible(leftShoulder) ||
        !visible(leftElbow) ||
        !visible(leftWrist) ||

        !visible(rightShoulder) ||
        !visible(rightElbow) ||
        !visible(rightWrist)
    ) {

        status.textContent =
            "Плохо видно руки";

        return;
    }


    /*
     * Угол локтей
     */

    const leftAngle =
        calculateAngle(
            leftShoulder,
            leftElbow,
            leftWrist
        );


    const rightAngle =
        calculateAngle(
            rightShoulder,
            rightElbow,
            rightWrist
        );


    const averageAngle =
        (
            leftAngle +
            rightAngle
        ) / 2;


    /*
     * Проверяем ноги.
     */

    const legsOK =
        legsAreExtended(
            landmarks
        );


    /*
     * Проверяем корпус.
     */

    const bodyOK =
        bodyIsReasonablyStraight(
            landmarks
        );


    /*
     * НИЖНЯЯ ТОЧКА
     */

    if (
        averageAngle < 110 &&
        position === "up"
    ) {

        /*
         * Запоминаем движение вниз,
         * даже если техника немного плохая.
         */

        position = "down";

        canCount = true;

        status.textContent =
            "Вверх 💪";

        return;
    }


    /*
     * ВЕРХНЯЯ ТОЧКА
     */

    if (
        averageAngle > 150 &&
        position === "down" &&
        canCount
    ) {

        /*
         * Повтор засчитываем только
         * если ноги и корпус подходят.
         */

        if (!legsOK) {

            status.textContent =
                "Выпрями ноги ❌";

        } else if (!bodyOK) {

            status.textContent =
                "Держи корпус ровнее ❌";

        } else if (
            !elbowsAreAcceptable(landmarks)
        ) {

            status.textContent =
                "Локти слишком в стороны ❌";

        } else {

            pushUps++;

            counter.textContent =
                "Отжимания: " +
                pushUps;

            status.textContent =
                "Отжимание засчитано ✅";
        }


        position = "up";

        canCount = false;

        return;
    }


    /*
     * Подготовка следующего повтора.
     */

    if (
        averageAngle < 120 &&
        position === "up"
    ) {

        canCount = true;
    }

}

</script>

</body>
</html>
