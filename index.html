<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>PushRep</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: Arial, sans-serif;
        }

        #startScreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #startScreen h1 {
            font-size: 32px;
            margin: 0 0 10px;
        }

        #startScreen p {
            color: #aaa;
        }

        #cameraButton {
            margin-top: 25px;
            padding: 16px 28px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        #cameraBox {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            overflow: hidden;
        }

        #camera {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: none;
        }

        #canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: none;
        }

        #status {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);

            padding: 10px 16px;
            border-radius: 12px;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            font-size: 15px;
            z-index: 10;
            white-space: nowrap;
        }

        #counter {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);

            color: white;
            background: rgba(0, 0, 0, 0.75);

            padding: 10px 22px;
            border-radius: 15px;

            font-size: 28px;
            font-weight: bold;

            z-index: 10;
        }
    </style>
</head>

<body>

<div id="startScreen">

    <h1>💪 PushRep</h1>

    <p>AI-счётчик отжиманий</p>

    <button id="cameraButton">
        📷 Включить камеру
    </button>

</div>


<div id="cameraBox">

    <video id="camera"
           autoplay
           playsinline
           muted>
    </video>

    <canvas id="canvas"></canvas>

    <div id="status">
        Запуск...
    </div>

    <div id="counter">
        Отжимания: 0
    </div>

</div>


<script>

const button =
    document.getElementById("cameraButton");

const startScreen =
    document.getElementById("startScreen");

const cameraBox =
    document.getElementById("cameraBox");

const video =
    document.getElementById("camera");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const status =
    document.getElementById("status");

const counter =
    document.getElementById("counter");


let pose = null;
let cameraStream = null;
let aiReady = false;


/* =========================
   СЧЁТЧИК
========================= */

let pushUps = 0;

let position = "up";

let canCount = true;


/* =========================
   КНОПКА
========================= */

button.addEventListener(
    "click",
    startCamera
);


/* =========================
   КАМЕРА
========================= */

async function startCamera() {

    try {

        startScreen.style.display = "none";

        cameraBox.style.display = "block";

        status.textContent =
            "Запрашиваем камеру...";


        cameraStream =
            await navigator.mediaDevices.getUserMedia({

                video: {

                    facingMode: "user",

                    width: {
                        ideal: 1920
                    },

                    height: {
                        ideal: 1080
                    }

                },

                audio: false

            });


        video.srcObject =
            cameraStream;


        await video.play();


        canvas.width =
            video.videoWidth;

        canvas.height =
            video.videoHeight;


        status.textContent =
            "Камера работает ✅";


        startAI();


    } catch (error) {

        console.error(error);

        cameraBox.style.display = "none";

        startScreen.style.display = "flex";

        alert(
            "Ошибка камеры:\n" +
            error.message
        );

    }

}


/* =========================
   AI
========================= */

function startAI() {

    status.textContent =
        "Загружаем AI...";


    if (typeof Pose === "undefined") {

        status.textContent =
            "AI ещё загружается...";

        setTimeout(
            startAI,
            1000
        );

        return;
    }


    pose = new Pose({

        locateFile: function(file) {

            return (
                "https://cdn.jsdelivr.net/npm/@mediapipe/pose/" +
                file
            );

        }

    });


    pose.setOptions({

        modelComplexity: 1,

        smoothLandmarks: true,

        enableSegmentation: false,

        smoothSegmentation: false,

        minDetectionConfidence: 0.5,

        minTrackingConfidence: 0.5

    });


    pose.onResults(onResults);


    aiReady = true;

    status.textContent =
        "AI готов 🤖";


    detectPose();

}


/* =========================
   РАСПОЗНАВАНИЕ
========================= */

async function detectPose() {

    if (
        !aiReady ||
        !video.videoWidth
    ) {

        requestAnimationFrame(
            detectPose
        );

        return;
    }


    try {

        await pose.send({
            image: video
        });

    } catch (error) {

        console.error(error);

    }


    requestAnimationFrame(
        detectPose
    );

}


/* =========================
   РЕЗУЛЬТАТ AI
========================= */

function onResults(results) {

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    if (results.poseLandmarks) {

        drawConnectors(
            ctx,
            results.poseLandmarks,
            POSE_CONNECTIONS,
            {
                color: "#00FF00",
                lineWidth: 5
            }
        );


        drawLandmarks(
            ctx,
            results.poseLandmarks,
            {
                color: "#FF0000",
                lineWidth: 2,
                radius: 6
            }
        );


        countPushUp(
            results.poseLandmarks
        );


    } else {

        status.textContent =
            "Встань в кадр";

    }

}


/* =========================
   УГОЛ ТРЁХ ТОЧЕК
========================= */

function calculateAngle(a, b, c) {

    const radians =
        Math.atan2(
            c.y - b.y,
            c.x - b.x
        ) -
        Math.atan2(
            a.y - b.y,
            a.x - b.x
        );


    let angle =
        Math.abs(
            radians * 180 / Math.PI
        );


    if (angle > 180) {

        angle =
            360 - angle;

    }


    return angle;
}


/* =========================
   ПРОВЕРКА ВИДИМОСТИ
========================= */

function visible(point) {

    return (
        point &&
        point.visibility !== undefined &&
        point.visibility >= 0.55
    );
}


/* =========================
   ПРОВЕРКА КОЛЕНЕЙ
========================= */

function kneesAreStraight(landmarks) {

    const leftHip =
        landmarks[23];

    const leftKnee =
        landmarks[25];

    const leftAnkle =
        landmarks[27];


    const rightHip =
        landmarks[24];

    const rightKnee =
        landmarks[26];

    const rightAnkle =
        landmarks[28];


    /*
     * Если ноги не видны,
     * не засчитываем повтор.
     */

    if (
        !visible(leftHip) ||
        !visible(leftKnee) ||
        !visible(leftAnkle) ||
        !visible(rightHip) ||
        !visible(rightKnee) ||
        !visible(rightAnkle)
    ) {

        return false;

    }


    /*
     * Угол колена.
     *
     * Прямая нога ≈ 180°.
     * При отжимании с колен
     * угол значительно меньше.
     */

    const leftKneeAngle =
        calculateAngle(
            leftHip,
            leftKnee,
            leftAnkle
        );


    const rightKneeAngle =
        calculateAngle(
            rightHip,
            rightKnee,
            rightAnkle
        );


    /*
     * Обе ноги должны быть
     * достаточно прямыми.
     */

    return (
        leftKneeAngle > 150 &&
        rightKneeAngle > 150
    );
}


/* =========================
   ПРОВЕРКА КОРПУСА
========================= */

function bodyIsStraight(landmarks) {

    const leftShoulder =
        landmarks[11];

    const leftHip =
        landmarks[23];

    const leftAnkle =
        landmarks[27];


    const rightShoulder =
        landmarks[12];

    const rightHip =
        landmarks[24];

    const rightAnkle =
        landmarks[28];


    if (
        !visible(leftShoulder) ||
        !visible(leftHip) ||
        !visible(leftAnkle) ||

        !visible(rightShoulder) ||
        !visible(rightHip) ||
        !visible(rightAnkle)
    ) {

        return false;
    }


    /*
     * Угол плечо-таз-лодыжка.
     *
     * Для прямого тела он
     * должен быть близок к 180°.
     */

    const leftBodyAngle =
        calculateAngle(
            leftShoulder,
            leftHip,
            leftAnkle
        );


    const rightBodyAngle =
        calculateAngle(
            rightShoulder,
            rightHip,
            rightAnkle
        );


    /*
     * Допускаем небольшой наклон.
     */

    return (
        leftBodyAngle > 155 &&
        rightBodyAngle > 155
    );
}


/* =========================
   ПРОВЕРКА ЛОКТЕЙ
========================= */

function elbowsAreGood(landmarks) {

    const leftShoulder =
        landmarks[11];

    const leftElbow =
        landmarks[13];

    const leftWrist =
        landmarks[15];


    const rightShoulder =
        landmarks[12];

    const rightElbow =
        landmarks[14];

    const rightWrist =
        landmarks[16];


    if (
        !visible(leftShoulder) ||
        !visible(leftElbow) ||
        !visible(leftWrist) ||

        !visible(rightShoulder) ||
        !visible(rightElbow) ||
        !visible(rightWrist)
    ) {

        return false;
    }


    const leftAngle =
        calculateAngle(
            leftShoulder,
            leftElbow,
            leftWrist
        );


    const rightAngle =
        calculateAngle(
            rightShoulder,
            rightElbow,
            rightWrist
        );


    /*
     * На верхней точке руки
     * должны быть почти выпрямлены.
     */

    const goodTop =
        leftAngle > 150 &&
        rightAngle > 150;


    /*
     * Не разрешаем слишком
     * экстремальное положение локтей.
     *
     * Проверяем расстояние локтя
     * от плеча относительно
     * расстояния плеч.
     */

    const shoulderWidth =
        Math.abs(
            leftShoulder.x -
            rightShoulder.x
        );


    const elbowWidth =
        Math.abs(
            leftElbow.x -
            rightElbow.x
        );


    /*
     * Если локти сильно разлетаются
     * в стороны, движение не считаем
     * правильным.
     */

    const elbowsTooWide =
        elbowWidth >
        shoulderWidth * 2.0;


    return (
        goodTop &&
        !elbowsTooWide
    );
}


/* =========================
   ОСНОВНОЙ СЧЁТЧИК
========================= */

function countPushUp(landmarks) {

    const leftShoulder =
        landmarks[11];

    const leftElbow =
        landmarks[13];

    const leftWrist =
        landmarks[15];


    const rightShoulder =
        landmarks[12];

    const rightElbow =
        landmarks[14];

    const rightWrist =
        landmarks[16];


    if (
        !visible(leftShoulder) ||
        !visible(leftElbow) ||
        !visible(leftWrist) ||

        !visible(rightShoulder) ||
        !visible(rightElbow) ||
        !visible(rightWrist)
    ) {

        status.textContent =
            "Плохо видно руки";

        return;
    }


    /*
     * Проверяем ноги.
     */

    const straightLegs =
        kneesAreStraight(landmarks);


    if (!straightLegs) {

        status.textContent =
            "Выпрями ноги";

        return;
    }


    /*
     * Проверяем корпус.
     */

    const straightBody =
        bodyIsStraight(landmarks);


    if (!straightBody) {

        status.textContent =
            "Держи корпус ровно";

        return;
    }


    /*
     * Углы локтей.
     */

    const leftAngle =
        calculateAngle(
            leftShoulder,
            leftElbow,
            leftWrist
        );


    const rightAngle =
        calculateAngle(
            rightShoulder,
            rightElbow,
            rightWrist
        );


    const averageAngle =
        (
            leftAngle +
            rightAngle
        ) / 2;


    /*
     * НИЖНЯЯ ТОЧКА
     */

    if (
        averageAngle < 105 &&
        position === "up"
    ) {

        position = "down";

        canCount = true;

        status.textContent =
            "Теперь вверх 💪";

        return;
    }


    /*
     * ВЕРХНЯЯ ТОЧКА
     */

    if (
        averageAngle > 155 &&
        position === "down" &&
        canCount
    ) {

        /*
         * Перед засчётом ещё раз
         * проверяем локти.
         */

        if (
            elbowsAreGood(landmarks)
        ) {

            pushUps++;

            counter.textContent =
                "Отжимания: " +
                pushUps;

            status.textContent =
                "Правильное повторение ✅";

        } else {

            status.textContent =
                "Локти слишком в стороны ❌";
        }


        position = "up";

        canCount = false;

        return;
    }


    /*
     * Разрешаем следующий цикл,
     * когда руки снова согнулись.
     */

    if (
        averageAngle < 115 &&
        position === "up"
    ) {

        canCount = true;

    }

}

</script>

</body>
</html>
