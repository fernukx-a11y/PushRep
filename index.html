<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PushRep</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: white;
        }

        h1 {
            margin-top: 40px;
            font-size: 32px;
        }

        p {
            color: #aaa;
            font-size: 17px;
        }

        button {
            margin-top: 30px;
            padding: 16px 30px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>💪 PushRep</h1>

    <p>AI-счётчик отжиманий</p>

    <button onclick="startWorkout()">
        Начать тренировку
    </button>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        function startWorkout() {
            alert("🚧 Тренировка пока в разработке");
        }
    </script>

</body>
</html>
